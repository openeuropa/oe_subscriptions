name: ci
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - 1.x

jobs:
  automated-tests:
    uses: openeuropa/github-ci/.github/workflows/drupal-ci.yml@main

  composer-patches-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        composer_patches_version:
          - "^1.7"
          # Temporarily satisfy decoupled_auth's ~1.0 constraint while testing
          # the real 2.0.0 plugin. Remove the alias when upstream allows 2.x.
          - "2.0.0 as 1.7.0"
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
      - name: Select Composer Patches version
        run: |
          composer require --no-update "cweagans/composer-patches:${{ matrix.composer_patches_version }}"
      - name: Install dependencies
        run: composer install --no-scripts --ansi --no-progress --no-interaction
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
