name: ci
on:
  pull_request:
    types: [opened, synchronize]
  push:
    branches:
      - 1.x

jobs:
  automated-tests:
    uses: openeuropa/github-ci/.github/workflows/drupal-ci.yml@main

  composer-patches-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        composer_patches_version:
          - "^1.7"
          - "^2.0"
    steps:
      - name: Clone repository
        uses: actions/checkout@v6
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
      - name: Select Composer Patches version
        run: |
          composer require --no-update "cweagans/composer-patches:${{ matrix.composer_patches_version }}"
          # decoupled_auth pins Composer Patches 1.x and isn't needed to check
          # whether this project's message_digest patches apply.
          composer remove --dev --no-update drupal/decoupled_auth
      - name: Install dependencies
        run: composer install --no-scripts --ansi --no-progress --no-interaction
        env:
          COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'
